<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>

  <!-- Left Code Bracket < -->
  <path d="M160 176 L96 256 L160 336" fill="none" stroke="url(#aiGrad2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Code Bracket > -->
  <path d="M352 176 L416 256 L352 336" fill="none" stroke="url(#aiGrad2)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central AI Core Structure -->
  <g filter="url(#glow)">
    <polygon points="256,160 320,256 256,352 192,256" fill="none" stroke="#00F2FE" stroke-width="12"/>
    <circle cx="256" cy="256" r="28" fill="url(#aiGrad2)"/>
  </g>
  
  <!-- Synapse Rings -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="#4FACFE" stroke-width="6" stroke-dasharray="12 12"/>
</svg>
